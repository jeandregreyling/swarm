<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fridays — Seven's Swarm</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   FRIDAYS SWARM — FLOATING WINDOW UI
   Themes: Dark (default), Apple, Nature, Mint
   ═════════════════════════════════════════════════════════════════════════ */

* { box-sizing: border-box; }
body { margin: 0; padding: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }

/* ─────────────────────────────────────────────────────────────────────────
   THEME VARIABLES
   ───────────────────────────────────────────────────────────────────────── */

:root {
  --bg: #0D0D10;
  --card: #1A1A24;
  --card-hover: #202030;
  --border: #2A2A3A;
  --text: #E2E2F0;
  --text-dim: #7070A0;
  --accent: #4caf50;
  --accent-hover: #66bb6a;
  --danger: #EF4444;
  --info: #3B82F6;
  --window-bg: #13131A;
  --window-header: #0D0D10;
  --radius: 8px;
  --shadow: 0 10px 30px rgba(0,0,0,0.5);
}

body.theme-apple {
  --bg: #0F0F0F;
  --card: #1C1C1C;
  --card-hover: #262626;
  --border: #333333;
  --text: #E8E8E8;
  --text-dim: #808080;
  --accent: #0071E3;
  --accent-hover: #0077ED;
  --window-bg: #1C1C1C;
  --window-header: #121212;
}

body.theme-nature {
  --bg: #0D1210;
  --card: #1A2320;
  --card-hover: #212B28;
  --border: #2A3A35;
  --text: #E2E8E0;
  --text-dim: #7A8A7F;
  --accent: #10B981;
  --accent-hover: #34D399;
  --window-bg: #152620;
  --window-header: #0D1210;
}

body.theme-mint {
  --bg: #0A1A1F;
  --card: #1A2A34;
  --card-hover: #223A46;
  --border: #2A3A4A;
  --text: #E0EEFF;
  --text-dim: #7088A0;
  --accent: #06B6D4;
  --accent-hover: #22D3EE;
  --window-bg: #152A35;
  --window-header: #0A1A1F;
}

/* ─────────────────────────────────────────────────────────────────────────
   MAIN SHELL
   ───────────────────────────────────────────────────────────────────────── */

body {
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

#home-page {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  z-index: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  opacity: 1;
  transition: opacity 0.3s ease;
}

#home-page.hidden {
  opacity: 0;
  pointer-events: none;
}

#home-header {
  padding: 24px 32px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#home-title {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

#home-title span { color: var(--accent); }

#home-controls {
  display: flex;
  gap: 12px;
  align-items: center;
}

.theme-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--card);
  cursor: pointer;
  transition: all 0.2s;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.theme-btn:hover { background: var(--card-hover); border-color: var(--accent); }
.theme-btn.active { border-color: var(--accent); background: rgba(76, 175, 80, 0.1); }

#home-content {
  flex: 1;
  padding: 32px;
  overflow-y: auto;
  display: grid;
  gap: 20px;
}

#home-content::-webkit-scrollbar { width: 6px; }
#home-content::-webkit-scrollbar-track { background: transparent; }
#home-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.home-section {
  margin-bottom: 12px;
}

.home-section-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  margin-bottom: 12px;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}

.home-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}

.home-card:hover {
  background: var(--card-hover);
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(76, 175, 80, 0.1);
}

.card-icon { font-size: 28px; margin-bottom: 8px; }
.card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.card-desc { font-size: 11px; color: var(--text-dim); }

.add-card-btn {
  background: var(--card);
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 120px;
  color: var(--text-dim);
}

.add-card-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin-top: 12px;
}

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
}

.stat-value { font-size: 18px; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

/* ─────────────────────────────────────────────────────────────────────────
   FLOATING WINDOWS
   ───────────────────────────────────────────────────────────────────────── */

#window-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
  pointer-events: none;
}

#window-container > * { pointer-events: auto; }

.floating-window {
  position: fixed;
  background: var(--window-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 100;
  min-width: 300px;
  min-height: 200px;
}

.floating-window.minimized {
  height: 40px;
  overflow: hidden;
}

.window-header {
  background: var(--window-header);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: grab;
  user-select: none;
  flex-shrink: 0;
}

.window-header:active { cursor: grabbing; }

.window-title {
  font-size: 13px;
  font-weight: 600;
  flex: 1;
}

.window-controls {
  display: flex;
  gap: 8px;
  align-items: center;
}

.window-btn {
  width: 28px;
  height: 28px;
  border: none;
  background: transparent;
  cursor: pointer;
  border-radius: 4px;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  color: var(--text-dim);
}

.window-btn:hover {
  background: var(--card);
  color: var(--text);
}

.window-btn.close:hover {
  background: var(--danger);
  color: white;
}

.window-content {
  flex: 1;
  overflow: auto;
  padding: 16px;
}

.window-resize-handle {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 20px;
  height: 20px;
  cursor: nwse-resize;
  background: linear-gradient(135deg, transparent 50%, var(--border) 50%);
  opacity: 0.5;
}

.floating-window:hover .window-resize-handle { opacity: 1; }

/* ─────────────────────────────────────────────────────────────────────────
   TASKBAR
   ───────────────────────────────────────────────────────────────────────── */

#taskbar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 50px;
  background: var(--window-header);
  border-top: 1px solid var(--border);
  z-index: 50;
  display: flex;
  gap: 8px;
  padding: 6px 12px;
  align-items: center;
  overflow-x: auto;
}

#taskbar::-webkit-scrollbar { height: 4px; }
#taskbar::-webkit-scrollbar-thumb { background: var(--border); }

.taskbar-btn {
  padding: 6px 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  white-space: nowrap;
  transition: all 0.2s;
  color: var(--text);
}

.taskbar-btn:hover { background: var(--card-hover); border-color: var(--accent); }
.taskbar-btn.active { border-color: var(--accent); background: rgba(76, 175, 80, 0.1); }

#home-btn {
  padding: 6px 12px;
  background: var(--accent);
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  color: white;
  font-weight: 600;
  transition: all 0.2s;
}

#home-btn:hover { background: var(--accent-hover); }

#spacer { flex: 1; }

/* ─────────────────────────────────────────────────────────────────────────
   CONTENT STYLES
   ───────────────────────────────────────────────────────────────────────── */

.content-view {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

#view-chat {
  display: flex;
  flex-direction: column;
}

#chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

#chat-messages::-webkit-scrollbar { width: 6px; }
#chat-messages::-webkit-scrollbar-thumb { background: var(--border); }

#input-area {
  padding: 12px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

#input-wrapper {
  display: flex;
  gap: 8px;
}

#question-input {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 12px;
  color: var(--text);
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
  resize: none;
}

#question-input:focus { border-color: var(--accent); }

#send-btn {
  padding: 8px 16px;
  background: var(--accent);
  border: none;
  border-radius: 4px;
  color: white;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.2s;
}

#send-btn:hover { background: var(--accent-hover); }

#terminal-output {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 12px;
  color: #0f9;
  white-space: pre-wrap;
  word-break: break-word;
}

#terminal-buttons {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.cmd-btn {
  padding: 6px 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  font-size: 11px;
  white-space: nowrap;
  transition: all 0.2s;
  color: var(--text-dim);
}

.cmd-btn:hover { border-color: var(--accent); color: var(--accent); }

.welcome { text-align: center; padding: 20px; color: var(--text-dim); }
.welcome h3 { color: var(--text); margin-bottom: 8px; }

/* ─────────────────────────────────────────────────────────────────────────
   RESPONSIVE
   ───────────────────────────────────────────────────────────────────────── */

@media (max-width: 768px) {
  .card-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  #home-content { padding: 16px; }
  #home-header { padding: 16px; }
}

</style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════════════════════
     HOME / LANDING PAGE
     ════════════════════════════════════════════════════════════════════════ -->

<div id="home-page">
  <div id="home-header">
    <div>
      <div id="home-title">Fridays <span>⬡</span></div>
      <div style="font-size: 11px; color: var(--text-dim); margin-top: 2px;">Seven's Swarm</div>
    </div>
    <div id="home-controls">
      <button class="theme-btn active" onclick="setTheme('dark')" title="Dark">🌙</button>
      <button class="theme-btn" onclick="setTheme('apple')" title="Apple">🍎</button>
      <button class="theme-btn" onclick="setTheme('nature')" title="Nature">🌿</button>
      <button class="theme-btn" onclick="setTheme('mint')" title="Mint">🍃</button>
    </div>
  </div>

  <div id="home-content">
    <!-- Quick Access Cards -->
    <div class="home-section">
      <div class="home-section-title">Quick Access</div>

          <div class="card-desc">Ask the swarm</div>

          <div class="card-title">Monitor</div>

<!-- ════════════════════════════════════════════════════════════════════════
     FLOATING WINDOWS CONTAINER
     ════════════════════════════════════════════════════════════════════════ -->

<div id="window-container"></div>

<template id="view-chat">

      <span style="color: #0f9; font-weight: bold;">$</span>
      <input id="terminal-input" type="text" placeholder="Enter command..." style="flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 6px 10px; color: var(--text); outline: none;" onkeydown="if(event.key==='Enter') runTerminalCmd()">

<template id="view-memory">

<!-- ════════════════════════════════════════════════════════════════════════
     JAVASCRIPT
     ════════════════════════════════════════════════════════════════════════ -->

<script>
// ═══════════════════════════════════════════════════════════════════════════
// WINDOW MANAGER — Floating window system
// ═══════════════════════════════════════════════════════════════════════════

class WindowManager {
  constructor() {
    this.windows = new Map();
    this.zIndex = 100;
    this.dragging = null;
    this.resizing = null;
    this.load();
  }

  create(id, title, contentTemplateId, options = {}) {
    if (this.windows.has(id)) {
      this.focus(id);
      return this.windows.get(id);
    }

    const defaults = {
      width: Math.min(500, window.innerWidth * 0.6),
      height: Math.min(600, window.innerHeight * 0.7),
      x: Math.random() * 100 + 50,
      y: Math.random() * 100 + 50,
    };

    const config = { ...defaults, ...options };

    // Get template
    const template = document.getElementById(contentTemplateId);
    const content = template ? template.content.cloneNode(true) : document.createElement('div');

    // Create window
    const win = document.createElement('div');
    win.className = 'floating-window';
    win.id = `win-${id}`;
    win.style.width = config.width + 'px';
    win.style.height = config.height + 'px';
    win.style.left = config.x + 'px';
    win.style.top = config.y + 'px';
    win.style.zIndex = this.zIndex++;

    // Header
    const header = document.createElement('div');
    header.className = 'window-header';
    header.innerHTML = `
      <div class="window-title">${title}</div>
      <div class="window-controls">
        <button class="window-btn" onclick="winManager.toggleMaximize('${id}')" title="Maximize">⬚</button>
        <button class="window-btn" onclick="winManager.minimize('${id}')" title="Minimize">_</button>
        <button class="window-btn" onclick="winManager.pin('${id}')" title="Pin">📌</button>
        <button class="window-btn" onclick="winManager.fullscreen('${id}')" title="Fullscreen">⛶</button>
        <button class="window-btn close" onclick="winManager.close('${id}')" title="Close">✕</button>
      </div>
    `;

    // Resize handle
    const resize = document.createElement('div');
    resize.className = 'window-resize-handle';

    // Content area
    const contentDiv = document.createElement('div');
    contentDiv.className = 'window-content';
    contentDiv.appendChild(content);

    win.appendChild(header);
    win.appendChild(contentDiv);
    win.appendChild(resize);

    // Events
    header.addEventListener('mousedown', (e) => this.startDrag(e, id));
    resize.addEventListener('mousedown', (e) => this.startResize(e, id));

    document.getElementById('window-container').appendChild(win);

    this.windows.set(id, {
      el: win,
      id,
      title,
      config,
      minimized: false,
      maximized: false,
      fullscreen: false,
      pinned: false,
    });

    this.addTaskbarBtn(id, title);
    this.save();
    return this.windows.get(id);
  }

  focus(id) {
    const win = this.windows.get(id);
    if (win) {
      win.el.style.zIndex = this.zIndex++;
      const taskbarBtn = document.querySelector(`[data-winid="${id}"]`);
      if (taskbarBtn) {
        document.querySelectorAll('.taskbar-btn').forEach(b => b.classList.remove('active'));
        taskbarBtn.classList.add('active');
      }
    }
  }

  startDrag(e, id) {
    if (e.target.closest('.window-btn')) return;
    this.dragging = {
      id,
      startX: e.clientX,
      startY: e.clientY,
      startLeft: this.windows.get(id).el.offsetLeft,
      startTop: this.windows.get(id).el.offsetTop,
    };
    document.addEventListener('mousemove', (evt) => this.drag(evt));
    document.addEventListener('mouseup', () => this.stopDrag());
  }

  drag(e) {
    if (!this.dragging) return;
    const win = this.windows.get(this.dragging.id).el;
    const dx = e.clientX - this.dragging.startX;
    const dy = e.clientY - this.dragging.startY;
    win.style.left = (this.dragging.startLeft + dx) + 'px';
    win.style.top = (this.dragging.startTop + dy) + 'px';
  }

  stopDrag() {
    if (this.dragging) {
      this.focus(this.dragging.id);
      this.dragging = null;
      this.save();
    }
  }

  startResize(e, id) {
    this.resizing = {
      id,
      startX: e.clientX,
      startY: e.clientY,
      startWidth: this.windows.get(id).el.offsetWidth,
      startHeight: this.windows.get(id).el.offsetHeight,
    };
    document.addEventListener('mousemove', (evt) => this.resize(evt));
    document.addEventListener('mouseup', () => this.stopResize());
  }

  resize(e) {
    if (!this.resizing) return;
    const win = this.windows.get(this.resizing.id).el;
    const dw = e.clientX - this.resizing.startX;
    const dh = e.clientY - this.resizing.startY;
    win.style.width = Math.max(300, this.resizing.startWidth + dw) + 'px';
    win.style.height = Math.max(200, this.resizing.startHeight + dh) + 'px';
  }

  stopResize() {
    if (this.resizing) {
      this.resizing = null;
      this.save();
    }
  }

  minimize(id) {
    const win = this.windows.get(id);
    if (!win) return;
    win.minimized = !win.minimized;
    win.el.classList.toggle('minimized');
    this.save();
  }

  toggleMaximize(id) {
    const win = this.windows.get(id);
    if (!win) return;
    if (win.maximized) {
      win.el.style.left = win.config.x + 'px';
      win.el.style.top = win.config.y + 'px';
      win.el.style.width = win.config.width + 'px';
      win.el.style.height = win.config.height + 'px';
    } else {
      win.config.x = win.el.offsetLeft;
      win.config.y = win.el.offsetTop;
      win.config.width = win.el.offsetWidth;
      win.config.height = win.el.offsetHeight;
      win.el.style.left = '0px';
      win.el.style.top = '0px';
      win.style.width = '100vw';
      win.el.style.height = 'calc(100vh - 50px)';
    }
    win.maximized = !win.maximized;
    this.save();
  }

  pin(id) {
    const win = this.windows.get(id);
    if (win) {
      win.pinned = !win.pinned;
      this.save();
    }
  }

  fullscreen(id) {
    const win = this.windows.get(id);
    if (!win) return;
    if (win.fullscreen) {
      win.el.style.width = win.config.width + 'px';
      win.el.style.height = win.config.height + 'px';
    } else {
      win.el.style.width = '100vw';
      win.el.style.height = '100vh';
      win.el.style.left = '0px';
      win.el.style.top = '0px';
    }
    win.fullscreen = !win.fullscreen;
    this.save();
  }

  close(id) {
    const win = this.windows.get(id);
    if (win) {
      win.el.remove();
      this.windows.delete(id);
      const taskbarBtn = document.querySelector(`[data-winid="${id}"]`);
      if (taskbarBtn) taskbarBtn.remove();
      this.save();
    }
  }

  addTaskbarBtn(id, title) {
    const btn = document.createElement('button');
    btn.className = 'taskbar-btn active';
    btn.setAttribute('data-winid', id);
    btn.textContent = title;
    btn.onclick = () => {
      const win = this.windows.get(id);
      if (win && win.minimized) {
        this.minimize(id);
      } else {
        this.focus(id);
      }
    };
    const taskbar = document.getElementById('taskbar');
    const spacer = document.getElementById('spacer');
    taskbar.insertBefore(btn, spacer);
  }

  save() {
    const state = {};
    this.windows.forEach((win, id) => {
      state[id] = {
        x: win.el.offsetLeft,
        y: win.el.offsetTop,
        width: win.el.offsetWidth,
        height: win.el.offsetHeight,
        minimized: win.minimized,
        maximized: win.maximized,
        fullscreen: win.fullscreen,
        pinned: win.pinned,
      };
    });
    localStorage.setItem('fridays-windows', JSON.stringify(state));
  }

  load() {
    const saved = localStorage.getItem('fridays-windows');
    if (saved) {
      try {
        this.savedState = JSON.parse(saved);
      } catch (e) {
        this.savedState = {};
      }
    } else {
      this.savedState = {};
    }
  }
}

const winManager = new WindowManager();

// ═══════════════════════════════════════════════════════════════════════════
// THEME MANAGER
// ═══════════════════════════════════════════════════════════════════════════

function setTheme(name) {
  document.body.className = name === 'dark' ? '' : `theme-${name}`;
  localStorage.setItem('fridays-theme', name);
  
  document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
}

function loadTheme() {
  const saved = localStorage.getItem('fridays-theme') || 'dark';
  if (saved !== 'dark') {
    document.body.className = `theme-${saved}`;
  }
  const idx = { dark: 0, apple: 1, nature: 2, mint: 3 }[saved] || 0;
  document.querySelectorAll('.theme-btn')[idx].classList.add('active');
}

// ═══════════════════════════════════════════════════════════════════════════
// WINDOW FUNCTIONS
// ═══════════════════════════════════════════════════════════════════════════

function openWindow(id, title, templateId) {
  winManager.create(id, title, templateId);
  document.getElementById('home-page').classList.add('hidden');
}

function goHome() {
  document.getElementById('home-page').classList.remove('hidden');
}

function addCustomCard() {
  const name = prompt('Card title:');
  if (!name) return;
  const emoji = prompt('Emoji/Icon:');
  const desc = prompt('Description:');
  
  const card = document.createElement('div');
  card.className = 'home-card';
  card.innerHTML = `
    <div class="card-icon">${emoji || '📌'}</div>
    <div class="card-title">${name}</div>
    <div class="card-desc">${desc || 'Custom card'}</div>
  `;
  
  document.getElementById('quick-cards').appendChild(card);
}

// ═══════════════════════════════════════════════════════════════════════════
// TERMINAL COMMANDS
// ═══════════════════════════════════════════════════════════════════════════

function runTerminalCmd() {
  const input = document.getElementById('terminal-input');
  const output = document.getElementById('terminal-output');
  const cmd = input.value.trim();
  
  if (!cmd) return;
  
  const line = document.createElement('div');
  line.style.color = '#5c9bd6';
  line.textContent = '❯ ' + cmd;
  output.appendChild(line);
  
  input.value = '';
  
  fetch('/api/terminal/run', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({command: cmd})
  })
  .then(r => r.json())
  .then(data => {
    const res = document.createElement('div');
    res.style.color = data.ok ? '#0f9' : '#f77';
    res.textContent = data.output || '(done)';
    output.appendChild(res);
    output.scrollTop = output.scrollHeight;
  })
  .catch(e => {
    const err = document.createElement('div');
    err.style.color = '#f77';
    err.textContent = 'Error: ' + e.message;
    output.appendChild(err);
  });
}

// Quick command buttons
function cmdTerminal(cmd) {
  const output = document.getElementById('terminal-output');
  const line = document.createElement('div');
  line.style.color = '#5c9bd6';
  line.textContent = '❯ ' + cmd;
  output.appendChild(line);
  
  fetch('/api/terminal/run', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({command: cmd})
  })
  .then(r => r.json())
  .then(data => {
    const res = document.createElement('div');
    res.style.color = data.ok ? '#0f9' : '#f77';
    res.textContent = data.output || '(done)';
    output.appendChild(res);
    output.scrollTop = output.scrollHeight;
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// MESSAGE FUNCTIONS
// ═══════════════════════════════════════════════════════════════════════════

function sendMessage() {
  const input = document.getElementById('question-input');
  const messages = document.getElementById('chat-messages');
  const msg = input.value.trim();
  
  if (!msg) return;
  
  const userMsg = document.createElement('div');
  userMsg.style.color = '#4caf50';
  userMsg.style.marginBottom = '12px';
  userMsg.textContent = '> ' + msg;
  messages.appendChild(userMsg);
  
  input.value = '';
  
  fetch('/api/chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({message: msg})
  })
  .then(r => r.json())
  .then(data => {
    const botMsg = document.createElement('div');
    botMsg.style.color = '#d0d0d0';
    botMsg.style.marginBottom = '12px';
    botMsg.textContent = data.response || '...';
    messages.appendChild(botMsg);
    messages.scrollTop = messages.scrollHeight;
  })
  .catch(e => {
    const err = document.createElement('div');
    err.style.color = '#f77';
    err.textContent = 'Error: ' + e.message;
    messages.appendChild(err);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  loadTheme();
  
  // Add terminal buttons
  const btnContainer = document.getElementById('terminal-buttons');
  if (btnContainer) {
    const buttons = [
      ['🔄', 'Restart Terminal', 'sudo systemctl restart swarm-terminal'],
      ['💬', 'Restart Discord', 'sudo systemctl restart swarm-discord'],
      ['📊', 'Python Processes', 'ps aux | grep python | grep -v grep'],
      ['✓', 'Terminal Status', 'systemctl status swarm-terminal'],
      ['💾', 'Disk Usage', 'df -h'],
      ['🧠', 'Memory', 'free -h'],
    ];
    buttons.forEach(([icon, label, cmd]) => {
      const btn = document.createElement('button');
      btn.className = 'cmd-btn';
      btn.innerHTML = `<span>${icon}</span> ${label}`;
      btn.onclick = () => cmdTerminal(cmd);
      btnContainer.appendChild(btn);
    });
  }
});
