<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Clocks Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      min-height: 100vh;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #FF9E4D;
    }
    
    .debug-info {
      background: rgba(0,0,0,0.3);
      border: 1px solid #FF9E4D;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.6;
    }
    
    .debug-info div {
      margin: 4px 0;
    }
    
    .status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-weight: bold;
    }
    
    .status.ok { background: #22c55e; color: #000; }
    .status.error { background: #ef4444; color: #fff; }
    
    .clocks-wrapper {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      padding: 20px;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
      border: 1px solid rgba(255,158,77,0.3);
    }
    
    .clock-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,158,77,0.2);
      border-radius: 8px;
      min-width: 140px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .clock-item:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,158,77,0.5);
      transform: translateY(-2px);
    }
    
    .analog-clock {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,158,77,0.5);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
    }
    
    .clock-center {
      width: 8px;
      height: 8px;
      background: #FF9E4D;
      border-radius: 50%;
      position: absolute;
      z-index: 10;
    }
    
    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      background: #fff;
    }
    
    .hour-hand {
      width: 3px;
      height: 20px;
      margin-left: -1.5px;
      background: #FF9E4D;
    }
    
    .minute-hand {
      width: 2px;
      height: 28px;
      margin-left: -1px;
      background: #fff;
    }
    
    .second-hand {
      width: 1px;
      height: 32px;
      margin-left: -0.5px;
      background: #FF9E4D;
    }
    
    .digital-time {
      font-family: 'Courier New', monospace;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.4;
      text-align: center;
      color: #FF9E4D;
      letter-spacing: 1px;
    }
    
    .city-name {
      font-size: 14px;
      font-weight: 600;
      color: #ccc;
      text-align: center;
    }
    
    .timezone-offset {
      font-size: 11px;
      color: #888;
      text-align: center;
    }
    
    .click-hint {
      font-size: 10px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌍 World Clocks Test</h1>
    
    <div class="debug-info">
      <div><strong>Debug Info:</strong></div>
      <div>Status: <span class="status ok">Ready</span></div>
      <div>Local Time: <span id="local-time">--:--:--</span></div>
      <div>UTC Offset: <span id="utc-offset">--</span></div>
      <div>Clocks Rendered: <span id="clock-count">0</span>/5</div>
      <div>Last Update: <span id="last-update">--:--:--</span></div>
    </div>
    
    <div class="clocks-wrapper" id="clocks-container">
      <!-- Clocks will be generated here -->
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════════════════
    // TIMEZONE DATA
    // ═══════════════════════════════════════════════════════════════════════════
    
    const TIMEZONES = [
      { city: 'Melbourne', offset: 11 },
      { city: 'Singapore', offset: 8 },
      { city: 'Dubai', offset: 4 },
      { city: 'London', offset: 0 },
      { city: 'New York', offset: -5 }
    ];
    
    // ═══════════════════════════════════════════════════════════════════════════
    // TIME CALCULATION - The heart of everything
    // ═══════════════════════════════════════════════════════════════════════════
    
    function getTimeForTimezone(offset) {
      // Get current UTC time
      const now = new Date();
      const utcTime = now.getTime() + now.getTimezoneOffset() * 60000;
      
      // Apply timezone offset (in hours)
      const timeInZone = new Date(utcTime + (offset * 3600000));
      
      return {
        hours: timeInZone.getHours(),
        minutes: timeInZone.getMinutes(),
        seconds: timeInZone.getSeconds(),
        date: timeInZone
      };
    }
    
    // ═══════════════════════════════════════════════════════════════════════════
    // DIGITAL CLOCK - Shows HH:MM:SS
    // ═══════════════════════════════════════════════════════════════════════════
    
    function createDigitalClock(time) {
      const hours = String(time.hours).padStart(2, '0');
      const minutes = String(time.minutes).padStart(2, '0');
      const seconds = String(time.seconds).padStart(2, '0');
      
      return `${hours}:${minutes}<br><span style="font-size: 14px; opacity: 0.8;">${seconds}</span>`;
    }
    
    // ═══════════════════════════════════════════════════════════════════════════
    // ANALOGUE CLOCK - SVG with animated hands
    // ═══════════════════════════════════════════════════════════════════════════
    
    function createAnalogClock(time) {
      const hours = time.hours % 12;
      const minutes = time.minutes;
      const seconds = time.seconds;
      
      // Calculate angles (0° = 12 o'clock)
      const secondAngle = (seconds * 6); // 360 / 60 = 6 degrees per second
      const minuteAngle = (minutes * 6) + (seconds * 0.1); // 6 degrees per minute + 0.1 per second
      const hourAngle = (hours * 30) + (minutes * 0.5); // 30 degrees per hour + 0.5 per minute
      
      return `
        <div class="analog-clock">
          <!-- Hour hand -->
          <div class="hand hour-hand" style="transform: rotate(${hourAngle}deg);"></div>
          
          <!-- Minute hand -->
          <div class="hand minute-hand" style="transform: rotate(${minuteAngle}deg);"></div>
          
          <!-- Second hand -->
          <div class="hand second-hand" style="transform: rotate(${secondAngle}deg);"></div>
          
          <!-- Center dot -->
          <div class="clock-center"></div>
        </div>
      `;
    }
    
    // ═══════════════════════════════════════════════════════════════════════════
    // RENDER CLOCKS
    // ═══════════════════════════════════════════════════════════════════════════
    
    function renderClocks() {
      const container = document.getElementById('clocks-container');
      
      let html = '';
      TIMEZONES.forEach(tz => {
        const time = getTimeForTimezone(tz.offset);
        const offsetStr = tz.offset >= 0 ? `+${tz.offset}` : `${tz.offset}`;
        
        html += `
          <div class="clock-item">
            ${createAnalogClock(time)}
            <div class="digital-time">${createDigitalClock(time)}</div>
            <div class="city-name">${tz.city}</div>
            <div class="timezone-offset">UTC ${offsetStr}</div>
            <div class="click-hint">Click to change</div>
          </div>
        `;
      });
      
      container.innerHTML = html;
      
      // Update debug info
      const now = new Date();
      document.getElementById('local-time').textContent = 
        `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
      document.getElementById('utc-offset').textContent = 
        (now.getTimezoneOffset() / -60) + ' hours';
      document.getElementById('clock-count').textContent = TIMEZONES.length;
      document.getElementById('last-update').textContent = 
        `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
    }
    
    // ═══════════════════════════════════════════════════════════════════════════
    // INITIALIZE & ANIMATE
    // ═══════════════════════════════════════════════════════════════════════════
    
    // Initial render
    console.log('🕐 Initializing world clocks...');
    renderClocks();
    console.log('✅ Clocks rendered - updating every second');
    
    // Update every second (1000ms)
    setInterval(() => {
      renderClocks();
    }, 1000);
    
    // Click handlers
    document.addEventListener('click', (e) => {
      const clockItem = e.target.closest('.clock-item');
      if (clockItem) {
        const cityName = clockItem.querySelector('.city-name').textContent;
        console.log('🌐 Timezone clicked:', cityName);
        alert(`You clicked on ${cityName}\nThis would open a timezone picker in the actual app`);
      }
    });
  </script>
</body>
</html>
