<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mondcraft</title>
<style>
*{box-sizing:border-box;letter-spacing:0}html,body{margin:0;width:100%;height:100%;background:#142018;color:#edf5e9;font:12px monospace}body{display:grid;grid-template-rows:auto 1fr}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid #405340}h1{font-size:18px;margin:0}button,a,input{font:inherit}button,a{background:#30452c;border:1px solid #546c49;border-radius:4px;color:white;padding:6px 9px;cursor:pointer;text-decoration:none;font-size:11px}.controls{display:flex;gap:6px}button:disabled{opacity:.45}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;min-height:0}iframe{width:100%;height:100%;min-height:460px;border:0;background:#213e2a}aside{padding:12px;overflow:auto;border-left:1px solid #405340}#players{font-size:11px}.player{padding:7px 0;border-bottom:1px solid #30432f;overflow-wrap:anywhere}.player small{display:block;font-size:9px;color:#a6bc9b;margin-top:3px}#status,#events,#runtime{font-size:10px;color:#b4caa9;line-height:1.6}#runtime-panel{padding:8px 0;border-top:1px solid #405340;border-bottom:1px solid #405340;margin:8px 0}#runtime-panel h2{font-size:12px;margin:0 0 4px}#runtime-summary{margin:0 0 6px}#loaded-models{font-size:9px;color:#a6bc9b;overflow-wrap:anywhere}.loaded-model{padding:3px 0;border-top:1px solid #30432f}#error{color:#ffbf9c;font-size:10px;overflow-wrap:anywhere}.event{padding:6px 0;border-bottom:1px solid #30432f}form{display:flex;gap:4px;margin:12px 0}form input{min-width:0;width:100%;background:#22351f;border:1px solid #536e49;padding:7px;color:white;border-radius:4px}#rounds{width:40px;background:#22351f;color:white;border:1px solid #536e49;border-radius:4px;padding:4px}@media(max-width:620px){.layout{grid-template-columns:1fr;grid-template-rows:minmax(400px,65vh) auto}aside{border-left:0;border-top:1px solid #405340}#players{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}body{height:auto;min-height:100%}}
