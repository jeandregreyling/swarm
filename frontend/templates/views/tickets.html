<!-- tickets.html — extracted from terminal_base.html -->
<!-- Original: <template id="view-tickets"> -->
  <div class="content-view" style="display: flex; flex-direction: column;">
    <div style="padding: 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;">
      <h3 style="margin-bottom: 10px;">🎫 Tickets</h3>
      <input type="text" id="ticket-search" placeholder="Search tickets..." style="width: 100%; padding: 8px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 4px; color: var(--text); outline: none;">
    </div>
    <div id="tickets-content" style="flex: 1; overflow-y: auto; padding: 16px;">
      <p style="color: var(--text-dim); font-size: 12px;">Loading tickets...</p>
    </div>
  </div>
