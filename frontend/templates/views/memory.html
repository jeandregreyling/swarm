<!-- memory.html — extracted from terminal_base.html -->
<!-- Original: <template id="view-memory"> -->
  <div class="content-view">
    <!-- Memory header -->
    <div style="padding:10px 14px 0;border-bottom:1px solid var(--border);background:var(--window-header);flex-shrink:0;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <span style="font-size:13px;font-weight:700;">🧠 Memory Browser</span>
        <input type="text" id="memory-search" placeholder="Search all memories..." style="flex:1;padding:5px 10px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none;">
        <span id="memory-count" style="font-size:10px;color:var(--text-dim);white-space:nowrap;"></span>
      </div>
      <div id="memory-agent-tabs" style="display:flex;gap:4px;flex-wrap:wrap;padding-bottom:8px;">
        <button class="mem-tab active" data-agent="" onclick="_memTab(this,'')">All</button>
        <button class="mem-tab" data-agent="gemma"     onclick="_memTab(this,'gemma')">1 · Gemma3</button>
        <button class="mem-tab" data-agent="llama"     onclick="_memTab(this,'llama')">2 · LlaMA</button>
        <button class="mem-tab" data-agent="qwen"      onclick="_memTab(this,'qwen')">4 · Qwen</button>
        <button class="mem-tab" data-agent="librarian" onclick="_memTab(this,'librarian')">5 · Librarian</button>
        <button class="mem-tab" data-agent="eight"     onclick="_memTab(this,'eight')">8 · Eight</button>
        <button class="mem-tab" data-agent="nine"      onclick="_memTab(this,'nine')">9 · Groq</button>
        <button class="mem-tab" data-agent="ten"       onclick="_memTab(this,'ten')">10 · Ten</button>
        <button class="mem-tab" data-agent="eleven"    onclick="_memTab(this,'eleven')">11 · Grok</button>
        <button class="mem-tab" data-agent="twelve"    onclick="_memTab(this,'twelve')">12 · Claude</button>
      </div>
      <div id="memory-source-tabs" style="display:flex;gap:4px;flex-wrap:wrap;padding-bottom:8px;">
        <button class="mem-tab active" data-source="all" onclick="_memSourceTab(this,'all')">All Sources</button>
        <button class="mem-tab" data-source="db" onclick="_memSourceTab(this,'db')">DB Only</button>
        <button class="mem-tab" data-source="local" onclick="_memSourceTab(this,'local')">Local Files</button>
      </div>
      <div id="memory-bulk-toolbar" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 0 10px;">
        <button id="memory-select-visible-btn" onclick="memorySelectVisible()" style="background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:11px;">Select Visible</button>
        <button id="memory-clear-selection-btn" onclick="memoryClearSelection()" style="background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:11px;">Clear Selection</button>
        <button id="memory-bulk-edit-btn" onclick="memoryOpenBulkEdit()" style="background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:11px;">Bulk Edit</button>
        <button id="memory-bulk-delete-btn" onclick="memoryBulkDelete()" style="background:transparent;border:1px solid #f4433660;color:#f44336;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:11px;">Bulk Delete</button>
        <span id="memory-selection-count" style="font-size:10px;color:var(--text-dim);white-space:nowrap;">0 selected</span>
      </div>
    </div>
    <!-- Memory list -->
    <div id="memory-list" style="flex:1;overflow-y:auto;min-height:0;"></div>
    <!-- Memory detail panel -->
    <div id="mem-detail" style="display:none;flex-shrink:0;border-top:1px solid var(--border);max-height:45%;overflow-y:auto;padding:14px 16px;background:var(--window-header);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <span style="font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em;">Entry Detail</span>
        <button onclick="document.getElementById('mem-detail').style.display='none'" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;">✕</button>
      </div>
      <div id="mem-det-body"></div>
    </div>
  </div>
