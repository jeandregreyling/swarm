<div class="content-view" id="media-center-root" style="display:flex;flex-direction:column;height:100%;min-height:0;">
  <div style="padding:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
    <div>
      <div style="font-size:13px;font-weight:700;color:var(--text);">Media Center — Consume + Produce</div>
      <div style="font-size:11px;color:var(--text-dim);">Studio-linked media ops with local runners and Knowledge Center seeding.</div>
    </div>
    <div style="display:flex;gap:8px;">
      <button onclick="mediaSeedSong()" style="padding:6px 10px;background:#4caf5020;border:1px solid #4caf5060;border-radius:6px;color:#4caf50;font-size:11px;cursor:pointer;">Seed test song</button>
      <button onclick="mediaCaptureScreenshot()" style="padding:6px 10px;background:#1565c020;border:1px solid #1565c060;border-radius:6px;color:#64b5f6;font-size:11px;cursor:pointer;">Take screenshot</button>
      <button onclick="loadMediaData()" style="padding:6px 10px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px;cursor:pointer;">Refresh</button>
    </div>
  </div>

  <div id="media-layout" style="flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,34%) 8px minmax(340px,1fr);">
    <section id="media-consume-panel" style="overflow:auto;min-width:240px;resize:horizontal;padding:10px;border-right:1px solid var(--border);">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);font-weight:700;margin-bottom:8px;">Consume</div>
      <div id="media-providers" style="display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:10px;"></div>
      <div style="display:flex;gap:6px;margin-bottom:8px;">
        <input id="media-provider-name" placeholder="Add provider (e.g. Tidal)" style="flex:1;background:var(--window-header);border:1px solid var(--border);border-radius:6px;padding:7px 8px;color:var(--text);font-size:11px;">
        <button onclick="mediaAddProvider()" style="padding:7px 10px;background:var(--accent);border:1px solid var(--accent);border-radius:6px;color:#000;font-size:11px;cursor:pointer;">Add</button>
      </div>
      <div style="font-size:11px;color:var(--text-dim);margin:10px 0 6px;">Library</div>
      <div id="media-items" style="display:flex;flex-direction:column;gap:8px;"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;">
        <input id="media-item-title" placeholder="Track/Video title" style="grid-column:1/3;background:var(--window-header);border:1px solid var(--border);border-radius:6px;padding:7px 8px;color:var(--text);font-size:11px;">
        <input id="media-item-artist" placeholder="Artist/Channel" style="background:var(--window-header);border:1px solid var(--border);border-radius:6px;padding:7px 8px;color:var(--text);font-size:11px;">
        <input id="media-item-url" placeholder="Source URL" style="background:var(--window-header);border:1px solid var(--border);border-radius:6px;padding:7px 8px;color:var(--text);font-size:11px;">
        <button onclick="mediaAddItem()" style="grid-column:1/3;padding:7px 10px;background:#2196f320;border:1px solid #2196f360;border-radius:6px;color:#64b5f6;font-size:11px;cursor:pointer;">Add media entry</button>
      </div>
    </section>

    <div id="media-resizer" style="cursor:col-resize;background:color-mix(in srgb, var(--accent) 20%, transparent);"></div>

    <section id="media-produce-panel" style="overflow:auto;min-width:320px;padding:10px;">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);font-weight:700;margin-bottom:8px;">Produce</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
        <button onclick="mediaProduce('local_synth_audio_runner')" style="padding:8px 10px;background:#7b1fa220;border:1px solid #7b1fa260;border-radius:6px;color:#ce93d8;font-size:11px;cursor:pointer;">Generate audio (WAV)</button>
        <button onclick="mediaProduce('local_ffmpeg_video_runner')" style="padding:8px 10px;background:#ef6c0020;border:1px solid #ef6c0060;border-radius:6px;color:#ffb74d;font-size:11px;cursor:pointer;">Generate video (MP4)</button>
      </div>
      <textarea id="media-prompt" rows="3" placeholder="Prompt/context for runner" style="width:100%;box-sizing:border-box;background:var(--window-header);border:1px solid var(--border);border-radius:6px;padding:8px;color:var(--text);font-size:11px;resize:vertical;"></textarea>
      <div id="media-run-status" style="margin-top:8px;font-size:11px;color:var(--text-dim);"></div>
      <div style="font-size:11px;color:var(--text-dim);margin:12px 0 6px;">Run history</div>
      <div id="media-runs" style="display:flex;flex-direction:column;gap:8px;"></div>
    </section>
  </div>
</div>
