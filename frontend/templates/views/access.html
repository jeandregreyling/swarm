<!-- access.html — tabbed layout: Senders & Permissions | Users -->
<!-- Original: <template id="view-access"> -->
<div class="content-view" style="display:flex;flex-direction:column;height:100%;">
  <div style="padding:8px 10px;border-bottom:1px solid var(--border);background:var(--window-header);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
    <div style="display:flex;align-items:center;gap:12px;">
      <h3 style="margin:0;font-size:12px;"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" style="vertical-align:-1px"><path d="M6.5 9.5A2.5 2.5 0 1 1 9 7h4v2h-1.5v1.5H10V12H8.5V9.9A2.5 2.5 0 0 1 6.5 9.5Z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg> Access Control</h3>
      <div id="access-tab-bar" style="display:flex;gap:2px;">
        <button id="access-tab-senders" onclick="accessSwitchTab('senders')"
          style="padding:4px 10px;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:4px 4px 0 0;font-size:10px;font-weight:600;cursor:pointer;">Senders & Permissions</button>
        <button id="access-tab-users" onclick="accessSwitchTab('users')"
          style="padding:4px 10px;background:var(--card);color:var(--text-dim);border:1px solid var(--border);border-radius:4px 4px 0 0;font-size:10px;font-weight:600;cursor:pointer;">Users</button>
      </div>
    </div>
    <button onclick="accessRefreshTab()" style="background:transparent;border:1px solid var(--border);border-radius:4px;padding:4px 8px;color:var(--text-dim);font-size:9px;cursor:pointer;">↻ Refresh</button>
  </div>
  <!-- TAB: SENDERS & PERMISSIONS -->
  <div id="access-panel-senders" style="flex:1;overflow-y:auto;padding:18px 0 0 0;display:flex;flex-direction:column;gap:24px;">
    <!-- ADD SENDER FORM -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;padding:12px;background:var(--card);border-radius:6px;border:1px solid var(--border);">
      <input type="text" id="access-new-address" placeholder="email / telegram:id / discord:id / domain.com"
             style="flex:1;min-width:200px;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;">
      <select id="access-new-list"
              style="padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;">
        <option value="trusted"><svg viewBox="0 0 16 16" width="10" height="10" fill="none"><circle cx="8" cy="8" r="5" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 8l2 2 3-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg> Trusted</option>
        <option value="notification"><svg viewBox="0 0 16 16" width="10" height="10" fill="none"><path d="M5 6.5a3 3 0 0 1 6 0c0 2.5 1 3.5 1.5 4H3.5c.5-.5 1.5-1.5 1.5-4ZM7 12.5a1.5 1.5 0 0 0 2 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg> Notification</option>
        <option value="domain"><svg viewBox="0 0 16 16" width="10" height="10" fill="none"><circle cx="8" cy="8" r="5" stroke="currentColor" stroke-width="1.3"/><path d="M3 8h10M8 3c-1.7 2-1.7 8 0 10M8 3c1.7 2 1.7 8 0 10" stroke="currentColor" stroke-width="1.3"/></svg> Domain</option>
      </select>
      <input type="text" id="access-new-note" placeholder="Note (optional)"
             style="width:160px;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;">
      <button onclick="accessAdd()"
              style="padding:7px 14px;background:var(--accent);color:#000;border:none;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;">Add</button>
    </div>
    <!-- THREE LISTS -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:0;">
      <div>
        <div style="font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;"><svg viewBox="0 0 16 16" width="11" height="11" fill="none" style="vertical-align:-1px"><circle cx="8" cy="8" r="5" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 8l2 2 3-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg> Trusted — full pipeline</div>
        <div id="access-trusted-list" style="font-size:12px;"></div>
      </div>
      <div>
        <div style="font-size:11px;font-weight:700;color:#fa0;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;"><svg viewBox="0 0 16 16" width="11" height="11" fill="none" style="vertical-align:-1px"><path d="M5 6.5a3 3 0 0 1 6 0c0 2.5 1 3.5 1.5 4H3.5c.5-.5 1.5-1.5 1.5-4ZM7 12.5a1.5 1.5 0 0 0 2 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg> Notification / Ignored</div>
        <div id="access-notification-list" style="font-size:12px;"></div>
      </div>
      <div style="grid-column:1/-1;">
        <div style="font-size:11px;font-weight:700;color:#8af;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;"><svg viewBox="0 0 16 16" width="11" height="11" fill="none" style="vertical-align:-1px"><circle cx="8" cy="8" r="5" stroke="currentColor" stroke-width="1.3"/><path d="M3 8h10M8 3c-1.7 2-1.7 8 0 10M8 3c1.7 2 1.7 8 0 10" stroke="currentColor" stroke-width="1.3"/></svg> Trusted Domains</div>
        <div id="access-domain-list" style="font-size:12px;"></div>
      </div>
    </div>
    <!-- SKILL PERMISSIONS -->
    <div>
      <div style="font-size:11px;font-weight:700;color:#c8f;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;"><svg viewBox="0 0 16 16" width="11" height="11" fill="none" style="vertical-align:-1px"><path d="M3 4.5h10M3 8h10M3 11.5h10M6 3v3M10 6.5v3M7 10v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg> Skill Permissions</div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;">
        <select id="skill-perm-user" onchange="loadSkillPerms()"
                style="flex:1;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;">
          <option value="">— select a user / agent —</option>
        </select>
        <span id="skill-perm-status" style="font-size:11px;color:var(--text-dim);white-space:nowrap;"></span>
      </div>
      <div id="skill-perm-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:8px;"></div>
    </div>
    <!-- ROLES & SKILLS ADMIN (if needed) -->
    <div>
      <div style="font-size:11px;font-weight:700;color:#0af;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;"><svg viewBox="0 0 16 16" width="11" height="11" fill="none" style="vertical-align:-1px"><path d="M4 3h8v10H4zM6 6h4M6 8h4M6 10h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg> Roles & Skills Management</div>
      <div id="roles-skills-admin-panel">
        <!-- Roles & skills management UI will be rendered here by JS -->
      </div>
    </div>
  </div>
  <!-- TAB: USERS -->
  <div id="access-panel-users" style="flex:1;overflow-y:auto;padding:18px 12px 12px 12px;display:none;flex-direction:column;gap:16px;">
    <!-- Add User Form -->
    <div style="padding:12px;background:var(--card);border-radius:6px;border:1px solid var(--border);">
      <div style="font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;">
        <svg viewBox="0 0 16 16" width="11" height="11" fill="none" style="vertical-align:-1px"><path d="M8 2a3 3 0 100 6 3 3 0 000-6zM3 14c0-2.8 2.2-5 5-5s5 2.2 5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M12 3v4M10 5h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg> Add New User
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <input type="email" id="access-user-email" placeholder="Email address"
               style="flex:1;min-width:180px;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;">
        <input type="text" id="access-user-name" placeholder="Preferred name"
               style="width:140px;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;">
        <input type="password" id="access-user-pw" placeholder="Password"
               style="width:120px;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;">
        <select id="access-user-role" style="padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;">
          <option value="viewer">Viewer</option>
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
        <button onclick="accessCreateUser()"
                style="padding:7px 14px;background:var(--accent);color:#000;border:none;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;">Add</button>
      </div>
    </div>
    <!-- User List -->
    <div id="access-users-list" style="display:flex;flex-direction:column;gap:6px;">
      <div style="color:var(--text-dim);font-size:12px;">Loading users…</div>
    </div>
  </div>
</div>
