<!-- access.html — extracted from terminal_base.html -->
<!-- Original: <template id="view-access"> -->
  <div class="content-view" style="display:flex;flex-direction:column;height:100%;">
    <div style="padding:16px;border-bottom:1px solid var(--border);background:var(--window-header);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
      <div>
        <h3 style="margin-bottom:4px;">🔑 Access Control</h3>
        <div style="font-size:11px;color:var(--text-dim);">Trusted senders, ignored addresses, skill permissions</div>
      </div>
      <button onclick="loadAccessData(window._accessWin)" style="background:transparent;border:1px solid var(--border);border-radius:4px;padding:5px 10px;color:var(--text-dim);font-size:11px;cursor:pointer;">↻ Refresh</button>
    </div>
    <div style="flex:1;overflow-y:auto;padding:16px;">

      <!-- ADD SENDER FORM -->
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px;padding:12px;background:var(--card);border-radius:6px;border:1px solid var(--border);">
        <input type="text" id="access-new-address" placeholder="email / telegram:id / discord:id / domain.com"
               style="flex:1;min-width:200px;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;">
        <select id="access-new-list"
                style="padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;">
          <option value="trusted">✅ Trusted</option>
          <option value="notification">🔔 Notification</option>
          <option value="domain">🌐 Domain</option>
        </select>
        <input type="text" id="access-new-note" placeholder="Note (optional)"
               style="width:160px;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;">
        <button onclick="accessAdd()"
                style="padding:7px 14px;background:var(--accent);color:#000;border:none;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;">Add</button>
      </div>

      <!-- THREE LISTS -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;">

        <div>
          <div style="font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">✅ Trusted — full pipeline</div>
          <div id="access-trusted-list" style="font-size:12px;"></div>
        </div>

        <div>
          <div style="font-size:11px;font-weight:700;color:#fa0;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">🔔 Notification / Ignored</div>
          <div id="access-notification-list" style="font-size:12px;"></div>
        </div>

        <div style="grid-column:1/-1;">
          <div style="font-size:11px;font-weight:700;color:#8af;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">🌐 Trusted Domains</div>
          <div id="access-domain-list" style="font-size:12px;"></div>
        </div>
      </div>

      <!-- DIVIDER -->
      <div style="border-top:1px solid var(--border);margin-bottom:20px;"></div>

      <!-- SKILL PERMISSIONS -->
      <div>
        <div style="font-size:11px;font-weight:700;color:#c8f;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">🎛 Skill Permissions</div>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;">
          <select id="skill-perm-user" onchange="loadSkillPerms()"
                  style="flex:1;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;">
            <option value="">— select a user / agent —</option>
          </select>
          <span id="skill-perm-status" style="font-size:11px;color:var(--text-dim);white-space:nowrap;"></span>
        </div>
        <div id="skill-perm-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:8px;"></div>
      </div>

    </div>
  </div>
