<!-- monitor.html — extracted from terminal_base.html -->
<!-- Original: <template id="view-monitor"> -->
  <div class="content-view" style="display:flex;flex-direction:column;height:100%;">
    <div style="padding:12px 16px;border-bottom:1px solid var(--border);background:var(--window-header);flex-shrink:0;display:flex;align-items:center;gap:10px;">
      <span style="font-size:13px;font-weight:700;">📡 System Monitor</span>
      <span id="monitor-refresh-indicator" style="font-size:10px;color:var(--text-dim);">auto-refresh 2.5s</span>
      <div style="flex:1;"></div>
      <button onclick="monitorManualRefresh()" style="background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:5px 10px;cursor:pointer;font-size:11px;">↻ Refresh</button>
    </div>
    <div id="monitor-content" style="flex:1;overflow-y:auto;padding:16px;">
      <div style="color: var(--text-dim); font-size: 12px;">Loading system information...</div>
    </div>
  </div>
