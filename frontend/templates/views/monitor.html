<!-- monitor.html — extracted from terminal_base.html -->
<!-- Original: <template id="view-monitor"> -->
  <div class="content-view" style="display:flex;flex-direction:column;height:100%;">
    <div style="padding:8px 10px;border-bottom:1px solid var(--border);background:var(--window-header);flex-shrink:0;display:flex;align-items:center;gap:8px;">
      <span style="font-size:11px;font-weight:700;">📡 System Monitor</span>
      <span id="monitor-refresh-indicator" style="font-size:8px;color:var(--text-dim);">auto-refresh 2.5s</span>
      <div style="flex:1;"></div>
      <button onclick="monitorManualRefresh()" style="background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:4px 8px;cursor:pointer;font-size:9px;">↻ Refresh</button>
    </div>
      <div id="monitor-content" style="flex:1;overflow-y:auto;padding:0;">
        <div style="padding:10px;">
          <h3 style="margin:0 0 10px 0;color:var(--text);font-size:12px;font-weight:600;">System Status</h3>
          <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(120px, 1fr));gap:12px;">
            <div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;">
              <span style="font-size:10px;color:var(--text-dim);text-transform:uppercase;">CPU Usage</span>
              <div class="gauge" style="width:50px;height:50px;border-radius:50%;background:conic-gradient(var(--accent) 0deg, var(--accent) 0%, var(--background) 0%, var(--background) 100%);position:relative;">
                <div class="gauge-fill" id="monitor-cpu-fill" style="width:50px;height:50px;border-radius:50%;background:var(--background);position:absolute;top:0;left:0;transform:rotate(0deg);transform-origin:center;"></div>
                <span id="monitor-cpu" style="position:absolute;top:50%;left:50%;transform:translate(-50%, -50%);font-size:12px;font-weight:700;color:var(--text);">0%</span>
              </div>
            </div>
            <div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;">
              <span style="font-size:10px;color:var(--text-dim);text-transform:uppercase;">RAM Usage</span>
              <div class="gauge" style="width:50px;height:50px;border-radius:50%;background:conic-gradient(var(--accent) 0deg, var(--accent) 0%, var(--background) 0%, var(--background) 100%);position:relative;">
                <div class="gauge-fill" id="monitor-ram-fill" style="width:50px;height:50px;border-radius:50%;background:var(--background);position:absolute;top:0;left:0;transform:rotate(0deg);transform-origin:center;"></div>
                <span id="monitor-ram" style="position:absolute;top:50%;left:50%;transform:translate(-50%, -50%);font-size:12px;font-weight:700;color:var(--text);">0%</span>
              </div>
            </div>
            <div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;">
              <span style="font-size:10px;color:var(--text-dim);text-transform:uppercase;">Temperature</span>
              <div class="gauge" style="width:50px;height:50px;border-radius:50%;background:conic-gradient(var(--accent) 0deg, var(--accent) 0%, var(--background) 0%, var(--background) 100%);position:relative;">
                <div class="gauge-fill" id="temp-gauge-fill" style="width:50px;height:50px;border-radius:50%;background:var(--background);position:absolute;top:0;left:0;transform:rotate(0deg);transform-origin:center;"></div>
                <span id="monitor-system-temp" style="position:absolute;top:50%;left:50%;transform:translate(-50%, -50%);font-size:12px;font-weight:700;color:var(--text);">0°C</span>
              </div>
            </div>
          </div>
        </div>
        <div style="color: var(--text-dim); font-size: 10px;padding:10px;">Loading additional system information...</div>
    </div>
  </div>
