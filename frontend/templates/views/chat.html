<!-- Main chat layout template
     This file provides a resizable chat window with a header, message list, and input area.
     It uses simple CSS flexbox for layout and a draggable resizer for resizing.
-->
<div id="chat-container" style="display:flex; flex-direction:column; height:100vh;">
  <header style="background:#333; color:#fff; padding:0.5rem; font-weight:bold;">Chat</header>
  <div id="chat-messages" style="flex:1; overflow:auto; padding:0.5rem; background:#f9f9f9;">
    <!-- Messages will be injected here by JavaScript -->
  </div>
  <div id="chat-resizer" style="height:5px; cursor:n-resize; background:#ddd;"></div>
  <footer style="display:flex; padding:0.5rem; background:#eee;">
    <input type="text" id="chat-input" style="flex:1; padding:0.5rem;" placeholder="Type a message..." />
    <button id="chat-send" style="margin-left:0.5rem;">Send</button>
  </footer>
</div>
<script>
  // Simple resize logic
  const resizer = document.getElementById('chat-resizer');
  const container = document.getElementById('chat-container');
  let startY, startHeight;
  resizer.addEventListener('mousedown', e => {
    startY = e.clientY;
    startHeight = container.offsetHeight;
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
  });
  function onMouseMove(e) {
    const dy = e.clientY - startY;
    container.style.height = (startHeight + dy) + 'px';
  }
  function onMouseUp() {
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup', onMouseUp);
  }
  // Placeholder for message handling
  const sendBtn = document.getElementById('chat-send');
  const input = document.getElementById('chat-input');
  const messages = document.getElementById('chat-messages');
  sendBtn.addEventListener('click', () => {
    const text = input.value.trim();
    if (!text) return;
    const msgDiv = document.createElement('div');
    msgDiv.textContent = text;
    messages.appendChild(msgDiv);
    input.value = '';
    messages.scrollTop = messages.scrollHeight;
  });
</script>
