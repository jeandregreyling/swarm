<!-- skills.html — extracted from terminal_base.html -->
<!-- Original: <template id="view-skills"> -->
  <div class="content-view" style="padding: 0; overflow-y: auto;">
    <h3 style="margin-bottom: 12px;"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" style="vertical-align:-1px"><path d="M8 5.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6Zm0-2.2v1.2m0 7.6V13m5-5H11.8M4.2 8H3m8.1-3.1.9-.9M4 12l.9-.9m6.2 0 .9.9M4 4l.9.9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg> Available Skills</h3>
    <div style="margin-bottom:12px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--window-header);">
      <div id="skills-identity-summary" style="font-size:11px;color:var(--text-dim);margin-bottom:8px;">Identity: loading...</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <label style="font-size:11px;color:var(--text-dim);">Manage permissions for:</label>
        <select id="skills-user-select" onchange="loadSkillPermissionEditor()" style="background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; min-width: 180px;"></select>
        <button onclick="openIdentityManager()" style="background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; cursor: pointer;">Identity</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;">
        <input id="skills-new-user" type="text" placeholder="new username" style="background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; min-width: 150px;">
        <input id="skills-new-display" type="text" placeholder="display name" style="background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; min-width: 150px;">
        <select id="skills-new-type" style="background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px;">
          <option value="human">human</option>
          <option value="agent">agent</option>
        </select>
        <button onclick="createUserProfileFromSkills()" style="background: var(--accent); color: #000; border: 1px solid var(--accent); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-weight:600;">Add User</button>
      </div>
    </div>
    <div id="skills-content">
      <p style="color: var(--text-dim); font-size: 12px;">SKILL list</p>
    </div>
    <h3 style="margin: 14px 0 10px;">🔐 Skill Permissions</h3>
    <div id="skills-permissions-content">
      <p style="color: var(--text-dim); font-size: 12px;">Loading permissions…</p>
    </div>
    <h3 style="margin: 14px 0 10px;">🧭 Agent Capability Matrix</h3>
    <div id="skills-capability-matrix">
      <p style="color: var(--text-dim); font-size: 12px;">Loading capability matrix…</p>
    </div>
  </div>
