<!-- potato-farm.html — Mesh topology, nodes, capabilities, task dispatch -->
<!-- View ID: view-potato-farm -->
<div class="content-view" style="display:flex;flex-direction:column;height:100%;">
  <div style="padding:8px 10px;border-bottom:1px solid var(--border);background:var(--window-header);flex-shrink:0;display:flex;align-items:center;gap:8px;">
    <span style="font-size:11px;font-weight:700;">
      <svg viewBox="0 0 16 16" width="12" height="12" fill="none" style="vertical-align:-1px">
        <circle cx="5" cy="5" r="2.5" stroke="currentColor" stroke-width="1.3"/>
        <circle cx="11" cy="5" r="2.5" stroke="currentColor" stroke-width="1.3"/>
        <circle cx="8" cy="11" r="2.5" stroke="currentColor" stroke-width="1.3"/>
        <path d="M6.5 6.5l1.5 2M9.5 6.5l-1.5 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg> Potato Farm
    </span>
    <span id="pfarm-meta" style="font-size:9px;color:var(--text-dim);">—</span>
    <div style="flex:1;"></div>
    <button onclick="pfarmRefresh()" style="background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:3px 8px;cursor:pointer;font-size:9px;">↻ Refresh</button>
  </div>

  <div id="pfarm-content" style="flex:1;overflow-y:auto;padding:10px;">
    <!-- Proof strip -->
    <div id="pfarm-proof" style="padding:10px;border:1px solid var(--accent);border-radius:6px;background:color-mix(in srgb,var(--accent) 14%,var(--card));margin-bottom:12px;font-size:11px;line-height:1.5;">
      <div style="font-weight:700;color:var(--text);">Samsung GPU handoff proof loading...</div>
      <div style="font-size:10px;color:var(--text-dim);">Waiting for potato-2 status.</div>
    </div>

    <!-- Network map -->
    <div style="padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--card);margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        <div style="font-weight:600;font-size:11px;">🕸 Network Map</div>
        <span id="pfarm-map-meta" style="font-size:9px;color:var(--text-dim);">—</span>
      </div>
      <div id="pfarm-map" style="min-height:220px;border:1px solid var(--border);border-radius:6px;background:rgba(0,0,0,.18);overflow:hidden;"></div>
    </div>

    <!-- Node grid -->
    <div id="pfarm-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:14px;">
      <div style="color:var(--text-dim);font-size:10px;">Loading mesh…</div>
    </div>

    <!-- Handoffs -->
    <div style="padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--card);margin-bottom:12px;">
      <div style="font-weight:600;margin-bottom:6px;font-size:11px;">🔁 Potato Handoffs</div>
      <div id="pfarm-handoffs" style="font-size:10px;color:var(--text-dim);display:grid;gap:6px;">Loading handoffs…</div>
    </div>

    <!-- Task dispatch panel -->
    <div style="padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--card);margin-bottom:12px;">
      <div style="font-weight:600;margin-bottom:8px;font-size:11px;">🚜 Dispatch Task</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;">
        <select id="pfarm-task-type" style="padding:4px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:10px;">
          <option value="tflite.gpu">Samsung GPU Packet</option>
          <option value="tflite.inference">TFLite Inference</option>
          <option value="ollama.chat">Ollama Chat</option>
          <option value="agent.run">Agent Run</option>
          <option value="git.sync">Git Sync</option>
          <option value="custom">Custom</option>
        </select>
        <select id="pfarm-target-node" style="padding:4px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:10px;">
          <option value="">Auto-route (best node)</option>
        </select>
        <input id="pfarm-task-payload" type="text" placeholder="Payload (JSON or text)…" style="flex:1;min-width:200px;padding:4px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:10px;"/>
        <button onclick="pfarmDispatch()" style="background:var(--accent);border:none;color:#000;border-radius:4px;padding:4px 12px;cursor:pointer;font-size:10px;font-weight:700;">Route</button>
      </div>
      <div id="pfarm-dispatch-status" style="margin-top:6px;font-size:9px;color:var(--text-dim);"></div>
    </div>

    <!-- Git sync status -->
    <div style="padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--card);margin-bottom:12px;">
      <div style="font-weight:600;margin-bottom:6px;font-size:11px;">🌿 Git Sync</div>
      <div id="pfarm-git-status" style="font-size:10px;color:var(--text-dim);">Checking…</div>
    </div>

    <!-- Mesh log -->
    <div style="padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--card);">
      <div style="font-weight:600;margin-bottom:6px;font-size:11px;">📡 Mesh Log</div>
      <div id="pfarm-log" style="font-size:9px;color:var(--text-dim);font-family:monospace;max-height:120px;overflow-y:auto;"></div>
    </div>
  </div>
</div>
