<!-- agents-config.html — extracted from terminal_base.html -->
<!-- Original: <template id="view-agents-config"> -->
  <div class="content-view" style="display:flex;flex-direction:column;height:100%;">
    <!-- Header -->
    <div style="padding:12px 16px;border-bottom:1px solid var(--border);background:var(--window-header);flex-shrink:0;">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span style="font-size:13px;font-weight:700;">🤖 Agents</span>
        <div style="flex:1;"></div>
        <button onclick="agentsRefresh()" style="background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:5px 10px;cursor:pointer;font-size:11px;">↻ Refresh</button>
        <button onclick="agentsShowAdd()" style="background:var(--accent);border:none;color:#000;border-radius:4px;padding:5px 12px;cursor:pointer;font-size:11px;font-weight:700;">+ Add Agent</button>
      </div>
    </div>
    <!-- Body: list + detail panel -->
    <div style="flex:1;display:flex;min-height:0;">
      <!-- Agent list -->
      <div id="agents-list" style="width:240px;flex-shrink:0;overflow-y:auto;border-right:1px solid var(--border);"></div>
      <!-- Detail / edit panel -->
      <div id="agents-detail" style="flex:1;overflow-y:auto;padding:0;"></div>
    </div>
    <!-- Global params footer -->
    <div id="agents-globals-section" style="flex-shrink:0;border-top:2px solid var(--border);background:var(--window-header);">
      <div style="padding:10px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;" onclick="agentsToggleGlobals()">
        <span style="font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;">🌐 Global Parameters</span>
        <span id="agents-globals-chevron" style="color:var(--text-dim);font-size:12px;">▸</span>
      </div>
      <div id="agents-globals-body" style="display:none;padding:0 16px 14px;"></div>
    </div>
  </div>
