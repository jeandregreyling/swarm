<!-- docs.html — extracted from terminal_base.html -->
<!-- Original: <template id="view-docs"> -->
  <div class="content-view" style="display:flex;flex-direction:column;height:100%;">
    <div style="padding: 16px; border-bottom:1px solid var(--border); background:var(--window-header); display:flex; justify-content:space-between; align-items:center; gap:10px;">
      <div>
        <h3 style="margin:0 0 4px 0;">📚 Documentation Center</h3>
        <div id="docs-governance" style="font-size:11px;color:var(--text-dim);">ALM status: loading...</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;">
        <button id="docs-tab-kb" onclick="docsSetTab('kb')" style="padding:5px 12px;border-radius:4px;border:1px solid var(--accent);background:var(--accent);color:#000;font-size:11px;font-weight:600;cursor:pointer;">Docs</button>
        <button id="docs-tab-workspace" onclick="docsSetTab('workspace')" style="padding:5px 12px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:11px;font-weight:600;cursor:pointer;">Workspace</button>
        <button id="docs-tab-brief" onclick="docsSetTab('brief')" style="padding:5px 12px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:11px;font-weight:600;cursor:pointer;">Ghost Brief</button>
        <button id="docs-tab-pinboard" onclick="docsSetTab('pinboard')" style="padding:5px 12px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:11px;font-weight:600;cursor:pointer;">&#128204; Pinboard</button>
        <button id="docs-tab-history" onclick="docsSetTab('history')" style="padding:5px 12px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:11px;font-weight:600;cursor:pointer;">ALM History</button>
        <button onclick="docsSetTab(window._docsTab || 'kb')" style="margin-left:4px;background:transparent;border:1px solid var(--border);border-radius:4px;padding:5px 10px;color:var(--text-dim);font-size:11px;cursor:pointer;">&#8635;</button>
      </div>
    </div>
    <div id="docs-content" style="flex:1;overflow-y:auto;padding:16px;">
      <p style="color: var(--text-dim); font-size: 12px;">Documentation loading...</p>
    </div>
  </div>
