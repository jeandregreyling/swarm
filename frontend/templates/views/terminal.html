<!-- terminal.html — extracted from terminal_base.html -->
<!-- Original: <template id="view-terminal"> -->
  <div class="content-view" style="display:flex;flex-direction:column;height:100%;">
    <div id="terminal-layout" style="display:flex;flex:1;min-height:0;">
      <div id="terminal-main" style="flex:1;display:flex;flex-direction:column;min-width:0;">
        <div id="terminal-output" style="flex:1; overflow-y:auto; font-family: 'SF Mono', monospace; font-size: 12px; color: #0f9; white-space: pre-wrap; padding: 12px;">Welcome to Fridays Terminal</div>
        <div id="terminal-history-panel" style="display:none;border-top:1px solid var(--border);background:var(--window-header);padding:8px 12px;max-height:180px;overflow:auto;"></div>
        <div style="padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px;">
          <button id="terminal-shortcuts-main-toggle" onclick="toggleTerminalShortcuts()" title="Hide shortcuts" style="background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:6px 10px;cursor:pointer;font-size:12px;white-space:nowrap;">⚡ Shortcuts</button>
          <button id="terminal-history-btn" onclick="terminalToggleHistory()" title="Show recent terminal commands" style="background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:6px 10px;cursor:pointer;font-size:12px;white-space:nowrap;">History</button>
          <button onclick="terminalClearOutput()" title="Clear terminal output" style="background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:6px 10px;cursor:pointer;font-size:12px;white-space:nowrap;">Clear</button>
          <span style="color: #0f9; font-weight: bold;">$</span>
          <input id="terminal-input" type="text" placeholder="Enter command..." style="flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 6px 10px; color: var(--text); outline: none;" onkeydown="terminalHandleInputKeydown(event)">
          <input id="terminal-filter-input" type="text" placeholder="Filter output" style="width: 150px; background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 6px 10px; color: var(--text); outline: none;" oninput="terminalFilterOutput(this.value)">
          <button id="terminal-autoscroll-toggle" onclick="terminalToggleAutoScroll()" title="Toggle auto-scroll" style="background:var(--card);border:1px solid var(--border);color:var(--text-dim);border-radius:4px;padding:6px 8px;cursor:pointer;font-size:11px;white-space:nowrap;">Auto-scroll: On</button>
          <button id="terminal-stop-btn" onclick="terminalStopActive()" title="Stop running command" disabled style="background:transparent;border:1px solid #f4433688;color:#f44336;border-radius:4px;padding:6px 10px;cursor:not-allowed;font-size:11px;white-space:nowrap;opacity:0.55;">Stop</button>
        </div>
      </div>
      <aside id="terminal-shortcuts-panel" style="width:230px;max-width:38%;border-left:1px solid var(--border);background:var(--window-header);display:flex;flex-direction:column;position:relative;">
        <div id="terminal-shortcuts-header" style="display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--border);">
          <div style="font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;">⚡ Shortcuts</div>
          <div id="terminal-shortcuts-header-controls" style="display:flex;gap:6px;align-items:center;">
            <button id="terminal-shortcuts-add" onclick="addTerminalShortcut()" title="Add shortcut" style="background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:2px 7px;cursor:pointer;font-size:12px;">+</button>
            <button id="terminal-shortcuts-toggle" onclick="toggleTerminalShortcuts()" title="Collapse" style="background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:2px 7px;cursor:pointer;font-size:12px;">⟩</button>
          </div>
        </div>
        <button id="terminal-shortcuts-restore" onclick="toggleTerminalShortcuts()" title="Expand shortcuts" style="display:none;position:absolute;top:8px;left:8px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:3px 8px;cursor:pointer;font-size:12px;line-height:1;">⟨</button>
        <div id="terminal-buttons"></div>
      </aside>
    </div>
  </div>
