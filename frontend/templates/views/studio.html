<!-- studio.html — extracted from terminal_base.html -->
<!-- Original: <template id="view-studio"> -->
  <div class="content-view" style="display: flex; flex-direction: column; height: 100%;">
    <div style="padding: 8px 10px; border-bottom: 1px solid var(--border); background: var(--window-header); display:flex; justify-content:space-between; align-items:center;">
      <div>
        <h3 style="margin-bottom: 3px;font-size:12px;"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" style="vertical-align:-1px"><path d="M8 3c-2.8 0-5 1.9-5 4.4 0 2.4 2 4.3 4.5 4.3H9a1.5 1.5 0 0 0 0-3h-.5a.8.8 0 0 1-.8-.8A1.9 1.9 0 0 1 9.6 6H11A2 2 0 0 0 13 4c0-.6-.3-1-.8-1.1A9.4 9.4 0 0 0 8 3Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg> Studio — Proposal Management</h3>
        <div style="font-size: 9px; color: var(--text-dim);">Review and approve agent proposals</div>
        <div id="studio-governance" style="margin-top:4px;font-size:9px;color:var(--text-dim);">ALM status: loading...</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
        <button id="studio-tab-pending"
          onclick="studioSetTab('pending')"
          style="padding:4px 10px;border-radius:4px;border:1px solid var(--accent);background:var(--accent);color:#000;font-size:9px;font-weight:600;cursor:pointer;">Pending</button>
        <button id="studio-tab-in_progress"
          onclick="studioSetTab('in_progress')"
          style="padding:4px 10px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:9px;font-weight:600;cursor:pointer;">In Progress</button>
        <button id="studio-tab-all"
          onclick="studioSetTab('all')"
          style="padding:4px 10px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:9px;font-weight:600;cursor:pointer;">History</button>
        <button id="studio-tab-appcenter"
          onclick="studioSetTab('appcenter')"
          title="App Center — backend app/game build projects, not Studio Git"
          style="padding:4px 10px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:9px;font-weight:600;cursor:pointer;">App Center</button>
        <button onclick="studioSetTab(window._studioTab || 'pending')"
          style="margin-left:4px;background:transparent;border:1px solid var(--border);border-radius:4px;padding:4px 8px;color:var(--text-dim);font-size:9px;cursor:pointer;">&#8635;</button>
      </div>
    </div>
    <div id="studio-content" style="flex: 1; overflow-y: auto; padding: 0;">
      <div style="color:var(--text-dim);font-size:10px;text-align:center;padding:14px;">Loading…</div>
    </div>
    <div id="studio-appcenter-panel" style="display:none;flex:1;flex-direction:column;min-height:0;overflow:hidden;">
      <div style="padding:12px 16px;border-bottom:1px solid var(--border);background:var(--window-header);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0;">
        <div>
          <div style="font-size:13px;font-weight:700;">App Center</div>
          <div style="font-size:11px;color:var(--text-dim);">Backend app/game build projects. Not Studio Git.</div>
        </div>
        <button onclick="loadStudioAppCenterPanel()" style="background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:5px 10px;cursor:pointer;font-size:11px;">Refresh</button>
      </div>
      <div id="appcenter-body" style="flex:1;overflow:auto;padding:12px;">
        <div style="color:var(--text-dim);font-size:11px;text-align:center;padding:14px;">Loading App Center...</div>
      </div>
    </div>
  </div>
