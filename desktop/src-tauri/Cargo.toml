[package]
name = "sevens-swarm"
version = "4.0.0"
description = "Seven's Swarm — Desktop wrapper"
authors = ["Seven"]
edition = "2021"

[lib]
name = "sevens_swarm_lib"
path = "src/main.rs"

[[bin]]
name = "sevens-swarm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
