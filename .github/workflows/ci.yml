name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check --select E,F,W --ignore E501,E402,F401,W503 frontend/ utils/ core/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          SWARM_ROOT: ${{ github.workspace }}
          SWARM_ENV: test
        run: python -m pytest tests/ -v --tb=short -q
      - name: Compile check all Python
        run: |
          find frontend/ utils/ core/ lib/ scripts/ -name '*.py' \
            -exec python -m py_compile {} \;

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan for committed secrets
        run: python scripts/secret_scan.py
      - name: Install safety
        run: pip install safety
      - name: Check dependencies
        run: safety check -r requirements.txt --output text || true
