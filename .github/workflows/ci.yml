name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Lint maintained CI helpers
        run: |
          ruff check --select E9,F63,F7,F82 scripts/secret_scan.py
          python -m py_compile frontend/blueprints/git.py scripts/secret_scan.py

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          SWARM_ROOT: ${{ github.workspace }}
          SWARM_ENV: test
        run: |
          python -m pytest -q \
            tests/test_chat_watchdog.py \
            tests/test_conversation_history_traces.py \
            tests/test_vortex_heartbeat_git_guard.py
      - name: Compile check maintained Python entrypoints
        run: |
          python -m py_compile \
            core/time_machine.py \
            frontend/blueprints/git.py \
            frontend/services/chat_jobs.py \
            fridays/task_runner.py \
            scripts/secret_scan.py \
            utils/db/chat.py

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan for committed secrets
        run: python scripts/secret_scan.py
      - name: Install safety
        run: pip install safety
      - name: Check dependencies
        run: safety check -r requirements.txt --output text || true
