# seven_merge.yaml — mergekit SLERP config for Seven
# Merges Qwen 2.5 7B Instruct + DeepSeek-R1-Distill-Qwen-7B
# Architecture: Both are Qwen2ForCausalLM — fully compatible

slices:
  - sources:
      - model: ./models/Qwen2.5-7B-Instruct
        layer_range: [0, 28]
      - model: ./models/DeepSeek-R1-Distill-Qwen-7B
        layer_range: [0, 28]

merge_method: slerp
base_model: ./models/Qwen2.5-7B-Instruct

parameters:
  t:
    # Self-attention: gradient blend — more DeepSeek reasoning in middle layers
    - filter: self_attn
      value: [0, 0.5, 0.3, 0.7, 1]
    # MLP: Qwen-heavy for knowledge retention, DeepSeek in reasoning layers
    - filter: mlp
      value: [0, 0.3, 0.7, 0.7, 0.3]
    # Default fallback
    - value: 0.5

dtype: bfloat16
